<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Tag Manager. Prod hosts only, so staging/localhost stay out of the data.
         Keep in sync with index.html. -->
    <script>
      if (['cortexi.ai', 'www.cortexi.ai'].includes(location.hostname)) {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag('js', new Date());
        document.head.appendChild(Object.assign(document.createElement('script'), {
          async: true, src: 'https://www.googletagmanager.com/gtm.js?id=GTM-5DTZ9QKC',
        }));
      }
    </script>
    <!-- Meta Pixel, so the ads can optimize for visits and leads instead of clicks. Prod hosts and the
         ad landing pages (/en, /en/free) only: other URLs can carry sign-in tokens and the pixel sends
         the full URL. No automatic events, so nothing typed on the page reaches Meta. Lead is sent
         from src/lib/gtm.js. -->
    <script>
      if (['cortexi.ai', 'www.cortexi.ai'].includes(location.hostname) && /^\/en(\/free)?\/?$/.test(location.pathname)) {
        const pixel = '1022437750876842';
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq.disablePushState = true; // no automatic PageView when the page moves to another URL in place
        fbq('set', 'autoConfig', false, pixel);
        fbq('init', pixel);
        fbq('track', 'PageView');
      }
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo/icon-192.png" />
    <link rel="apple-touch-icon" href="/logo/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Heebo (the LCP-critical font) is self-hosted and preloaded; Inter loads async -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/heebo-800-hebrew.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/heebo-400-hebrew.woff2" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      />
    </noscript>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/marketing/entry-client.jsx"></script>
  </body>
</html>
