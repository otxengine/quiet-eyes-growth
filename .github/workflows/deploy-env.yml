name: deploy-env
# Deploys one environment. Called by deploy-staging.yml once per environment.
# No stored AWS keys: the deploy job trades GitHub's OIDC token for the short-lived role that
# infra/lib/github-oidc-stack.ts creates, which trusts only jobs in that GitHub environment.
# Dependency code, vite.config.js and tailwind.config.js run in the build job, which can't mint
# that token; it hands dist/ to the deploy job, which takes the role only right before cdk deploy.
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true } # GitHub environment: staging | production
      stack: { type: string, required: true } # CDK stack: Qe-staging | Qe-prod
      role: { type: string, required: true } # IAM role the job assumes

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    # No environment: production's required reviewer gates every job that names it, even with
    # deployment: false, so it would be asked twice. The VITE_* values are public (they ship in
    # the bundle), so they're repo variables suffixed per environment, e.g. ..._PRODUCTION.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          : "${VITE_CLERK_PUBLISHABLE_KEY:?set repo variable VITE_CLERK_PUBLISHABLE_KEY_<ENVIRONMENT>}"
          npm run build
        env:
          VITE_API_URL: /api
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars[format('VITE_CLERK_PUBLISHABLE_KEY_{0}', inputs.environment)] }}
          VITE_FACEBOOK_APP_ID: ${{ vars[format('VITE_FACEBOOK_APP_ID_{0}', inputs.environment)] }}
          VITE_META_CONFIG_ID: ${{ vars[format('VITE_META_CONFIG_ID_{0}', inputs.environment)] }}
          VITE_PADDLE_CLIENT_TOKEN: ${{ vars[format('VITE_PADDLE_CLIENT_TOKEN_{0}', inputs.environment)] }}
          VITE_PADDLE_ENV: ${{ vars[format('VITE_PADDLE_ENV_{0}', inputs.environment)] }}
      - name: No server-side keys in the frontend bundle
        run: tr -d '\r' < scripts/scan-bundle-keys.sh | bash -s -- dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ inputs.environment }} # one run uploads staging and production
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04-arm
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.smoke.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ inputs.environment }}
          path: dist
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: infra

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role }}
          aws-region: eu-central-1
      - name: cdk deploy
        working-directory: infra
        env:
          SRC_DIR: ${{ github.workspace }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        # CI has no terminal to answer CDK's prompt; the human gates are the GitHub
        # environment's branch rules (and, for production, its required reviewer).
        run: npx cdk deploy ${{ inputs.stack }} --require-approval never

      - name: Smoke test
        id: smoke
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name ${{ inputs.stack }} \
            --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "$URL/api/healthz"
          curl -fsS -o /dev/null "$URL/"
          curl -fsS -o /dev/null "$URL/pricing"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/entities/BusinessProfile")
          [ "$code" = 401 ] || { echo "expected 401 without a token, got $code"; exit 1; }
