name: deploy-env
# Deploys one environment. Called by deploy-staging.yml once per environment.
# No stored AWS keys: the job trades GitHub's OIDC token for the short-lived role that
# infra/lib/github-oidc-stack.ts creates, which trusts only jobs in that GitHub environment.
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true } # GitHub environment: staging | production
      stack: { type: string, required: true } # CDK stack: Qe-staging | Qe-prod
      role: { type: string, required: true } # IAM role the job assumes

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.smoke.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role }}
          aws-region: eu-central-1

      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_URL: /api
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_FACEBOOK_APP_ID: ${{ vars.VITE_FACEBOOK_APP_ID }}
          VITE_META_CONFIG_ID: ${{ vars.VITE_META_CONFIG_ID }}
          VITE_PADDLE_CLIENT_TOKEN: ${{ vars.VITE_PADDLE_CLIENT_TOKEN }}
          VITE_PADDLE_ENV: ${{ vars.VITE_PADDLE_ENV }}
      - name: No server-side keys in the frontend bundle
        run: tr -d '\r' < scripts/scan-bundle-keys.sh | bash -s -- dist

      - run: npm ci --no-audit --no-fund
        working-directory: infra
      - name: cdk deploy
        working-directory: infra
        env:
          SRC_DIR: ${{ github.workspace }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        # CI has no terminal to answer CDK's prompt; the human gates are the GitHub
        # environment's branch rules (and, for production, its required reviewer).
        run: npx cdk deploy ${{ inputs.stack }} --require-approval never

      - name: Smoke test
        id: smoke
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name ${{ inputs.stack }} \
            --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "$URL/api/healthz"
          curl -fsS -o /dev/null "$URL/"
          curl -fsS -o /dev/null "$URL/pricing"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/entities/BusinessProfile")
          [ "$code" = 401 ] || { echo "expected 401 without a token, got $code"; exit 1; }
