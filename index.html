<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cortexi" />
    <link rel="apple-touch-icon" href="/logo/apple-touch-icon.png" />
    <meta name="theme-color" content="#111111" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Heebo (the LCP-critical font) is self-hosted and preloaded;
         Inter + Noto Sans Hebrew (app body font) load async -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/heebo-800-hebrew.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/heebo-400-hebrew.woff2" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Hebrew:wght@400;500;600;700;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Hebrew:wght@400;500;600;700;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Hebrew:wght@400;500;600;700;900&display=swap"
      />
    </noscript>
    <!-- SEO head is injected at build time by scripts/prerender.mjs (home route).
         In dev, the SPA sets the title per route at runtime. -->
    <!--app-head-->
    <style>
      @media print {
        body { background: white !important; }
        nav, aside, header, .no-print,
        [data-sidebar], [data-topbar],
        button:not(.print-keep) { display: none !important; }
        main, .print-content { width: 100% !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
        .card-base { break-inside: avoid; border: 1px solid #ddd !important; box-shadow: none !important; }
        @page { margin: 1.5cm; }
      }
    </style>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Meta / Facebook SDK loads on demand in Integrations.jsx (WhatsApp Embedded
         Signup) — loading it globally added third-party cookies to every page. -->
  </body>
</html>
